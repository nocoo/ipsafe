name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      node-version: "24.20.0"
      install-policy: blocked
      test-command: "npm run test:coverage"
      lint-command: "npm run lint"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "plain JavaScript project without TypeScript compiler setup"}'
      coverage-path: "coverage"
      lockfiles: "bun.lock,package-lock.json"
