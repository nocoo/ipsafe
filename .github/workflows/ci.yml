# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S2, S3, G1, G2, L1, P1, Z1 via quality.yml;
# na S1, B1, L1.5, L3; todo L2 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, P1 吸收 packed-CLI 安装验证。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: blocked
      typecheck: false
      disabled-check-reasons: '{"typecheck": "纯 JavaScript 项目，无 TypeScript 编译器配置"}'
      test-command: "npm run test:coverage"
      lint-command: "npm run lint"
      coverage-path: "coverage"
      lockfiles: "bun.lock,package-lock.json"
      workflow-lint: true
      package-check: true
      package-command: "npm run verify:packed-install"
      slot-status: >-
        {"S1": {"status": "na", "reason": "纯 JavaScript 项目，无 TypeScript 类型检查"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "na", "reason": "CLI 库无 build 脚本与可交付构建产物"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "非 Cloudflare Worker 项目"},
        "L2": {"status": "todo", "reason": "尚无 loopback HTTP 探针服务与 API E2E 测试套件"},
        "L3": {"status": "na", "reason": "无浏览器界面；npm pack 安装冒烟在 P1 执行"},
        "P1": {"status": "impl"},
        "Z1": {"status": "impl"}}
