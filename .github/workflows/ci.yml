name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      node-version: "24.20.0"
      install-policy: blocked
      test-command: "npm run test:coverage"
      lint-command: "npm run lint"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "plain JavaScript project without TypeScript compiler setup"}'
      coverage-path: "coverage"
      osv-config: "osv-scanner.toml"
      lockfiles: "bun.lock,package-lock.json"
